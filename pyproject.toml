[project]
name = "cmaputils"
version = "0.1.2"
description = "Useful utilities that support CMAP's modeling team's work with Census data"
readme = "README.rst"
requires-python = ">=3.11.6"
dependencies = [
    "aiohttp>=3.13.5",
    "furo>=2025.12.19",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
lint.ignore = ["E402"]
line-length = 80

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
    "sphinx>=9.0.0",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.0.4",
]

