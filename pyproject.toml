[project]
name = "cmaputils"
version = "0.1.0"
description = "Useful utilities that support CMAP's modeling team's work with Census data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
lint.ignore = ["E402"]
line-length = 80

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "sphinx>=9.1.0",
]

